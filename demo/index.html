<!DOCTYPE html>
<html lang="th" data-theme="pink" data-font="noto" data-size="md" data-density="normal" data-dock="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PulseMetrics — Business Marketing &amp; Lead Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap">
<style>
:root{--font:'Noto Sans Thai','Leelawadee UI','Segoe UI',sans-serif;--fs:15.5px;--bg:#f6f7fb;--surf:#ffffff;--surf2:#f0f1f6;--surf3:#f8f9fc;--bd:#dcdfe9;--tx:#12101c;--tx2:#2b293b;--dim:#49475c;--ac:#e8458b;--on-ac:#ffffff;--ac-ink:#bf2466;--ac-soft:#fde9f2;--ac-bd:#f6b6d1;--brand:#FF6FAE;--brand-grad:linear-gradient(135deg,#FF7BB5 0%,#e8458b 100%);--brand-tx:#ffffff;--ok:#158559;--ok-soft:rgba(31,169,113,.15);--warn:#b25f00;--warn-soft:rgba(217,115,31,.15);--bad:#c92a35;--bad-soft:rgba(229,72,77,.15)}
html[data-theme="pink"]{color-scheme:light;--bg:#f6f7fb;--surf:#ffffff;--surf2:#f0f1f6;--surf3:#f8f9fc;--bd:#dcdfe9;--tx:#12101c;--tx2:#2b293b;--dim:#49475c;--ac:#e8458b;--on-ac:#ffffff;--ac-ink:#bf2466;--ac-soft:#fde9f2;--ac-bd:#f6b6d1;--brand:#FF6FAE;--brand-grad:linear-gradient(135deg,#FF7BB5 0%,#e8458b 100%);--brand-tx:#ffffff}
html[data-theme="dark"]{color-scheme:dark;--bg:#0f111a;--surf:#181b28;--surf2:#222638;--surf3:#1d2132;--bd:#323854;--tx:#f8f9fd;--tx2:#e4e8f7;--dim:#bcc4df;--ac:#ff5ca0;--on-ac:#ffffff;--ac-ink:#ff99c5;--ac-soft:rgba(255,92,160,.18);--ac-bd:rgba(255,92,160,.48);--brand:#1e1729;--brand-grad:linear-gradient(135deg,#2a1938 0%,#171525 100%);--brand-tx:#ffffff}
html[data-theme="cyber"]{color-scheme:dark;--bg:#0a0e18;--surf:#131a2a;--surf2:#1c263c;--surf3:#162033;--bd:#2b3b5a;--tx:#f6faff;--tx2:#dee9f9;--dim:#b4c7e3;--ac:#06b6d4;--on-ac:#04151e;--ac-ink:#5ce8ff;--ac-soft:rgba(34,211,238,.17);--ac-bd:rgba(34,211,238,.48);--brand:#101c31;--brand-grad:linear-gradient(135deg,#0d2740 0%,#0d1526 100%);--brand-tx:#f2fbff}
html[data-theme="ocean"]{color-scheme:light;--bg:#f2f7fd;--surf:#ffffff;--surf2:#e8f0fb;--surf3:#f5f9ff;--bd:#cddcf2;--tx:#0f172a;--tx2:#283854;--dim:#445778;--ac:#2563eb;--on-ac:#ffffff;--ac-ink:#1d4ed8;--ac-soft:#e3efff;--ac-bd:#93c5fd;--brand:#3b82f6;--brand-grad:linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);--brand-tx:#ffffff}
html[data-theme="purple"]{color-scheme:light;--bg:#f6f4fd;--surf:#ffffff;--surf2:#efeafd;--surf3:#f9f7ff;--bd:#d9d0f5;--tx:#161129;--tx2:#352c52;--dim:#524773;--ac:#7c3aed;--on-ac:#ffffff;--ac-ink:#6d28d9;--ac-soft:#ede9fe;--ac-bd:#c4b5fd;--brand:#8b5cf6;--brand-grad:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);--brand-tx:#ffffff}
html[data-theme="mint"]{color-scheme:light;--bg:#f2faf7;--surf:#ffffff;--surf2:#e6f5f0;--surf3:#f5fcf9;--bd:#c4e5da;--tx:#0d1f1c;--tx2:#25403b;--dim:#3f615a;--ac:#0d9488;--on-ac:#ffffff;--ac-ink:#0f766e;--ac-soft:#daf5ef;--ac-bd:#7ee0d2;--brand:#14b8a6;--brand-grad:linear-gradient(135deg,#2dd4bf 0%,#0d9488 100%);--brand-tx:#ffffff}
html[data-theme="warm"]{color-scheme:light;--bg:#f6f0e4;--surf:#fdfaf3;--surf2:#ede4d4;--surf3:#f9f4ea;--bd:#ddd1bd;--tx:#261e16;--tx2:#4a3c2e;--dim:#736250;--ac:#c2552d;--on-ac:#ffffff;--ac-ink:#9e3f1c;--ac-soft:#fae9e0;--ac-bd:#e8b9a3;--brand:#c2552d;--brand-grad:linear-gradient(135deg,#df7951 0%,#c2552d 100%);--brand-tx:#ffffff}
html[data-font="noto"]{--font:'Noto Sans Thai','Leelawadee UI','Segoe UI',sans-serif}
html[data-font="plex"]{--font:'IBM Plex Sans Thai','Leelawadee UI','Segoe UI',sans-serif}
html[data-font="prompt"]{--font:'Prompt','Leelawadee UI','Segoe UI',sans-serif}
html[data-font="sys"]{--font:'Segoe UI','Leelawadee UI',sans-serif}
html[data-size="sm"]{--fs:14.5px}
html[data-size="md"]{--fs:15.5px}
html[data-size="lg"]{--fs:17px}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{
  background:var(--bg);color:var(--tx);font-family:var(--font);font-size:var(--fs);
  line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font-family:var(--font)}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;transition:.14s}
button:not(.ghost):not(.icon-btn):not(.th-opt):not(.th-seg):not(.th-dot):not(.th-tab):not(.cmd-it):not(.sb-it):not(.sb-qa):not(.sb-pomo):not(.wstab):not(.plat):not(.cc):not(.tab-btn){
  background:var(--ac);color:var(--on-ac);box-shadow:0 1px 3px rgba(232,69,139,.25)
}
button:hover{filter:brightness(1.04)}
button:disabled{opacity:.48;cursor:not-allowed;filter:none}
button.ghost{background:var(--surf);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.ghost:hover{border-color:var(--ac-bd);background:var(--surf3);filter:none}
input,select,textarea{
  background:var(--surf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;
  padding:8px 11px;font-size:14px;width:100%
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac-bd);border-color:var(--ac)}
::selection{background:var(--ac-soft);color:var(--tx)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
svg.ic{width:18px;height:18px;flex:none;vertical-align:-.18em}

/* Shell */
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .18s;position:relative;z-index:1}
html.nav-mini .app{grid-template-columns:68px minmax(0,1fr)}

/* Sidebar */
nav#nav{
  background:var(--surf);border-right:1px solid var(--bd);
  box-shadow:2px 0 10px rgba(30,30,60,.04);
  display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 28px);overflow-y:auto;z-index:40;
}
.brand{
  background:var(--brand-grad,var(--brand));color:var(--brand-tx);
  padding:16px 14px;display:flex;align-items:center;gap:11px;position:relative;flex:none;
}
.brand .logo{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);color:#fff;
  border:2px solid rgba(255,255,255,.45);display:grid;place-items:center;flex:none;
  font-family:"Arial Black","Segoe UI",sans-serif;font-size:16px;font-weight:900;letter-spacing:-.5px;
}
.brand-tx{min-width:0;flex:1}
.brand b{display:block;font-size:19px;line-height:1.1;font-weight:800;color:var(--brand-tx)}
.brand small{display:block;font-size:11px;opacity:.92;color:var(--brand-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navtog{
  width:28px;height:28px;padding:0;border-radius:8px;border:1px solid rgba(255,255,255,.32);
  background:rgba(0,0,0,.14);color:#fff;display:grid;place-items:center;flex:none;
}
#navtog:hover{background:rgba(0,0,0,.28)}
html.nav-mini .brand{padding:14px 10px;justify-content:center}
html.nav-mini .brand-tx,html.nav-mini .navsec,html.nav-mini details.ngrp summary,html.nav-mini nav a span,html.nav-mini nav a .nbadge,html.nav-mini .foot-meta{display:none!important}
html.nav-mini #navtog{position:absolute;right:4px;top:4px;width:22px;height:22px}
html.nav-mini nav a{justify-content:center;margin:2px 8px!important;padding:10px!important;border-radius:10px!important;border-left:0!important}

.navsec{padding:13px 18px 4px;font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--tx2);text-transform:uppercase}
nav a{
  display:flex;align-items:center;gap:10px;padding:8px 16px;margin:1px 10px 1px 0;
  border-radius:0 10px 10px 0;border-left:3px solid transparent;
  color:var(--tx);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;transition:.12s;
}
nav a.fav{padding:9.5px 16px;font-size:14.5px;font-weight:600}
nav a.fav svg.ic{width:19px;height:19px}
nav a:hover{background:var(--ac-soft);color:var(--tx)}
nav a.on{background:var(--ac-soft);color:var(--ac-ink);border-left-color:var(--ac);font-weight:700}
.nbadge{
  margin-left:auto;background:var(--ac);color:var(--on-ac);border-radius:999px;
  font-size:11px;line-height:18px;min-width:20px;text-align:center;padding:0 6px;font-weight:700;
}
.nbadge.dot{background:#e8a21f;color:#141018}
.nbadge.warn{background:#e5484d;color:#fff}
html.focus-on .nbadge,html.focus-on #bell-n{display:none!important}

details.ngrp summary{
  list-style:none;cursor:pointer;padding:10px 18px 5px;font-size:12px;font-weight:700;
  color:var(--tx2);display:flex;align-items:center;gap:6px;user-select:none;
}
details.ngrp summary::-webkit-details-marker{display:none}
details.ngrp summary::after{content:"›";margin-left:auto;transition:.15s;font-size:15px}
details.ngrp[open] summary::after{transform:rotate(90deg)}
details.ngrp summary .gsum{
  margin-left:auto;background:var(--ac);color:var(--on-ac);border-radius:999px;
  font-size:10.5px;line-height:16px;min-width:18px;text-align:center;padding:0 6px;font-weight:700;
}
details.ngrp[open] summary .gsum{display:none}
.navfoot{margin-top:auto;padding:12px 14px 14px;border-top:1px solid var(--bd);display:grid;gap:7px}
.foot-meta{text-align:center;font-size:11.5px;color:var(--dim)}

/* Main area */
main{min-width:0;padding:18px 26px 52px;position:relative}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap;padding-right:110px}
#mtog{display:none;width:38px;height:38px;padding:0;place-items:center}
#mailWstabs{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none}
#mailWstabs::-webkit-scrollbar{display:none}
.wstab{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
  border:1px solid var(--bd);background:var(--surf);color:var(--tx2);font-size:12px;font-weight:600;white-space:nowrap;flex:none;
}
.wstab:hover{border-color:var(--ac-bd);color:var(--tx);background:var(--surf3)}
.wstab.on{background:var(--ac-soft);border-color:var(--ac);color:var(--ac-ink)}

/* Top-Right Utility Dock */
#utildock{
  position:fixed;top:12px;right:16px;z-index:70;display:flex;align-items:center;gap:6px;
  padding:4px 6px;border-radius:999px;background:var(--surf);border:1px solid var(--bd);
  box-shadow:0 6px 22px rgba(20,16,30,.12);backdrop-filter:blur(10px);
}
.icon-btn{position:relative;width:34px;height:34px;padding:0;border-radius:50%;background:transparent;color:var(--tx2);display:grid;place-items:center}
.icon-btn:hover{background:var(--ac-soft);color:var(--ac-ink);filter:none}
.icon-btn.on{background:var(--ac-soft);color:var(--ac-ink);box-shadow:inset 0 0 0 1.5px var(--ac-bd)}
.icon-btn svg{width:17px;height:17px}
#docktog svg{width:16px;height:16px;transition:transform .18s ease}
html[data-dock="1"] #utildock > button:not(#docktog):not(#bellbtn){display:none!important}
html[data-dock="1"] #docktog svg{transform:rotate(180deg)}
html[data-dock="0"] .top-row{padding-right:320px}
#bell-n{position:absolute;top:-2px;right:-2px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;line-height:17px;padding:0 4px;text-align:center}

/* Page headers & cards */
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-hd h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.25px;color:var(--tx)}
.page-hd .sub{margin:3px 0 0;font-size:14px;color:var(--tx2)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(30,30,60,.06);min-width:0}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:7px}
.hero{background:linear-gradient(135deg,var(--surf) 0%,var(--ac-soft) 100%);border:1px solid var(--ac-bd);border-radius:16px;padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.dim{color:var(--dim);font-size:12.5px}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;margin:2px 0}
.bar{height:7px;background:var(--surf2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surf2);color:var(--tx2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ac{background:var(--ac-soft);color:var(--ac-ink)}
.pd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{border:1px solid var(--bd);background:var(--surf);color:var(--tx2);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
.tab-btn.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--tx2);font-size:12px;font-weight:700;background:var(--surf3)}

html[data-density="compact"] main .card{padding:11px 13px}
html[data-density="compact"] th,html[data-density="compact"] td{padding:5px 8px}
html[data-density="spacious"] main .card{padding:21px 23px}

/* Lists, Messages, Panels, Drawers, Modals */
.list-it{display:flex;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.list-it:hover{background:var(--surf3)}
.list-it.on{background:var(--ac-soft);border-color:var(--ac-bd)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto;padding:4px 2px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--surf2);color:var(--tx);font-size:13.5px;width:fit-content}
.msg.me{align-self:flex-end;background:var(--ac-soft);border:1px solid var(--ac-bd)}
.pop-panel{position:fixed;top:56px;right:16px;z-index:85;width:min(380px,93vw);max-height:76vh;overflow-y:auto;background:var(--surf);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:0 18px 48px rgba(15,17,26,.22);display:none}
.pop-panel.open{display:block}
.th-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:11px;background:var(--surf2);border:1px solid var(--bd);margin:8px 0 10px}
.th-tab{padding:6px 4px;border-radius:8px;border:0;background:transparent;color:var(--dim);font:700 11.5px/1.2 inherit;cursor:pointer;text-align:center;box-shadow:none;transition:.14s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-tab:hover{color:var(--tx);filter:none}
.th-tab.on{background:var(--surf);color:var(--ac-ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.th-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin:8px 0 12px}
.th-opt{display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:7px 8px;border-radius:11px;border:1px solid var(--bd);background:var(--surf3);color:var(--tx);text-align:left;font-size:12px;font-weight:600}
.th-opt.on{border-color:var(--ac);background:var(--ac-soft)}
.th-opt .thnm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.th-opt .thnm small{display:block;font-size:10px;font-weight:500;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thsw{width:19px;height:19px;border-radius:50%;flex:none;border:1.5px solid rgba(128,128,128,.3)}
.th-sec{font-size:11.5px;font-weight:700;color:var(--dim);margin:10px 0 5px}
.th-segs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.th-segs.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.th-seg{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--bd);background:var(--surf3);color:var(--tx2);font-size:12px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-seg.on{background:var(--ac-soft);border-color:var(--ac);color:var(--ac-ink)}
.th-dot{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid transparent}
.th-dot.on{border-color:var(--tx);transform:scale(1.12)}
.th-f{display:flex;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--bd)}
.th-q{flex:1;padding:7px 9px;border-radius:10px;border:1px solid var(--bd);background:var(--surf2)!important;color:var(--tx)!important;font-size:12px;font-weight:600;box-shadow:none!important}
.th-q:hover{border-color:var(--ac-bd);color:var(--ac-ink)!important}

.drawer-bg{position:fixed;inset:0;z-index:88;background:rgba(10,12,20,.28);backdrop-filter:blur(2px);display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:28px;z-index:90;width:min(420px,94vw);background:var(--surf);color:var(--tx);border-left:1px solid var(--bd);box-shadow:-12px 0 40px rgba(0,0,0,.24);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .22s cubic-bezier(.22,1,.36,1)}
.drawer.open{transform:translateX(0)}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border-bottom:1px solid var(--bd);background:linear-gradient(135deg,var(--surf) 0%,var(--ac-soft) 100%)}

.modal-ov{position:fixed;inset:0;z-index:95;background:rgba(10,12,20,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:min(10vh,80px)}
.modal-ov.open{display:flex}
.modal-box{width:min(560px,93vw);background:var(--surf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
#cmdtop{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--bd)}
#cmdin{border:0!important;outline:0!important;background:transparent!important;padding:2px 0;font-size:15px}
#cmdlist{max-height:54vh;overflow-y:auto;padding:6px}
.cmd-it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;background:transparent;color:var(--tx);font-size:13.5px;font-weight:500;text-align:left}
.cmd-it:hover,.cmd-it.sel{background:var(--ac-soft);color:var(--tx);filter:none}
.cmd-it .ck{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surf2);color:var(--dim);flex:none}
.cmd-it.sel .ck{background:var(--ac);color:var(--on-ac)}

/* Status bar, Toasts, Charts, Ops Buttons, Kanban */

.exp-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid var(--bd);background:var(--surf)!important;color:var(--tx)!important;box-shadow:none!important;transition:.14s}
.exp-btn:hover{transform:translateY(-1px);border-color:var(--ac-bd);background:var(--surf3)!important}

.exp-btn.xl{border-color:rgba(29,111,66,.35);background:rgba(29,111,66,.08)!important;color:#1d6f42!important}

.pl-strip{display:inline-flex;align-items:center;gap:5px}
.hs-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--ac) calc(var(--p)*1%), var(--surf2) 0)}
.hs-ring > div{width:58px;height:58px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--tx)}

.kb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
